name: alfa-insight-prototype
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfa_insight}
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - prototype_db:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-companies.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prototype
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alfa_insight}
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alfa_insight}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-https://api.alfahack-gateway26.ru/v1}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    volumes:
      - prototype_data:/data
      - prototype_models:/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
    restart: unless-stopped
volumes:
  prototype_db:
  prototype_data:
  prototype_models:
